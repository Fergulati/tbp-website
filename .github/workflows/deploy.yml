name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches:
      - main
  # Pull requests run the build only, to prove the site still builds; nothing is deployed.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: tbp-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tbp-next/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Builds the clip-search index, then the static site into tbp-next/out,
      # reading Markdown from ../content and static files from ../quartz/static.
      - name: Build site
        run: npm run build
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: tbp-next/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
